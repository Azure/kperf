version: 1
description: Pod CREATE baseline - 400 creates/sec for 10 minutes
specs:
  # Rate limit per runner.
  - rate: 400
    duration: 600
    total: 0
    client: 400
    conns: 20
    contentType: json
    maxRetries: 0
    requests:
      - shares: 1
        postDel:
          group: ""
          version: v1
          resource: pods
          namespace: pod-benchmark
          deleteRatio: 0
          # Env padding for an approximately 4 KiB Pod.
          payloadSize: 3650
          pod:
            labels:
              example.com/workload: benchmark
              benchmark: pod-create
              benchmark-run: replace-with-unique-run-id
            serviceAccountName: pod-benchmark
            schedulerName: kperf-unscheduled
